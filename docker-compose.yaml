services:
  database:
    image: postgres:latest
    container_name: trello_db
    ports:
      - "5432:5432"
    restart: always
    environment: 
      POSTGRES_PASSWORD: 12345678
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
